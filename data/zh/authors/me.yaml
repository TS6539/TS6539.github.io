# Chinese overrides for the owner profile. The theme's
# functions/get_authors_data partial merges data/zh/authors/ on top of
# data/authors/, so only translated fields live here; links, name and
# dates are inherited from data/authors/me.yaml. Lists (interests,
# education, experience, skills, languages) replace the base lists, so
# they are given in full.
role: 特任助理教授
bio: |
  郝天时是日本广岛大学外国语教育研究中心特任助理教授。他的研究横跨第二语言写作、学习科学与学习分析。他关注的问题是：当生成式人工智能能够随时起草、概括、解释和修改文本时，学生一侧究竟还发生了什么学习，以及这种学习如何从过程数据中追踪、而非仅凭自我报告来判断。他的主要研究方法是定量民族志与认知网络分析（ENA）。他的另一条研究主线是系统综述与人工智能支持的证据综合。

  在广岛大学，他教授学生运用人工智能进行写作的英语课程，并主持英语教育生成式人工智能指南的制定。他于 2024 年获佩珀代因大学全球领导力与变革博士学位，博士研究聚焦教育技术与虚拟领导力。他还于 2020 年获南加州大学 TESOL 教学硕士学位（MAT）。他是《Play to Learn: Use Video Games to Learn a New Language》（2020）一书的作者。

