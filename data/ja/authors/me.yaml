role: 特任助教
bio: |
  郝天時（かく・てんじ）は、広島大学外国語教育研究センターの特任助教です。第二言語ライティング、学習科学、ラーニングアナリティクスを横断して研究しています。生成AIが求めに応じて起草し、要約し、説明し、推敲できる時代に、学生の側ではなおどのような学びが起きているのか、そしてその学びを自己報告だけでなくプロセスデータからどう捉えることができるのかを問うています。主な研究手法は、量的エスノグラフィーとエピステミック・ネットワーク分析（ENA）です。もう一つの研究の柱は、システマティックレビューとAIを活用したエビデンス統合です。

  広島大学では、学生がAIとともに書くことを学ぶ英語科目を担当し、英語教育における生成AIガイドラインの策定を主導しています。2024年にペパーダイン大学でグローバル・リーダーシップと変革の博士号を取得し、博士研究では教育テクノロジーとバーチャル・リーダーシップを扱いました。2020年には南カリフォルニア大学でTESOLのMAT（教育修士）を取得しています。著書に『Play to Learn: Use Video Games to Learn a New Language』（2020年）があります。

