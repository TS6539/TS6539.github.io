      『Writing English with AI, On Your Own Terms』を担当しています。これは大学の学生・教職員を対象とした、10回完結の単位外研修プログラムの科目です。科目担当教員とともに、オンライン科目 Communication Basics および Communication Exercises のカリキュラム、教材、評価方法を開発し、専任教員の授業を参観してフィードバックを行っています。英語教育における生成AIガイドラインの策定を主導し、英語教育のデジタル化とAIリテラシーに関するFDワークショップを企画しています。研究テーマは、第二言語ライティングと学習プロセスにおける生成AIであり、量的エスノグラフィーとエピステミック・ネットワーク分析を用いています。
