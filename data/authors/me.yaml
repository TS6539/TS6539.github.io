bio: |
  Tianshi Hao is a language educator and researcher at Hiroshima University,
  Japan. His research sits at the intersection of educational technology, AI
  in language education, and generative AI in second-language writing. He
  studies how learners actually use AI tools — and what that use does to the
  quality of their work — using quantitative ethnography (epistemic network
  analysis) and systematic review methods. He earned his PhD in Global
  Leadership and Change from Pepperdine University (2024) and an MAT in TESOL
  from the University of Southern California (2020). He is the author of
  *Play to Learn: Use Video Games to Learn a New Language* (2020).

