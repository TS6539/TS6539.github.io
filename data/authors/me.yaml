bio: |
  Tianshi Hao is a Specially Appointed Assistant Professor at the Institute for Foreign Language Research and Education, Hiroshima University, Japan. He works across second language writing, the learning sciences, and learning analytics. His research asks what learning still happens on the student’s side when generative AI can draft, summarize, explain, and revise on demand, and how that learning can be traced in process data rather than in self-report alone. His primary methods are quantitative ethnography and epistemic network analysis. At Hiroshima he teaches English courses in which students learn to write with AI, and he leads the development of generative AI guidelines for English education. He holds a PhD in Global Leadership and Change from Pepperdine University (2024), where his research focused on educational technology and virtual leadership. He also holds an MAT in TESOL from the University of Southern California (2020). He is the author of Play to Learn: Use Video Games to Learn a New Language (2020).

