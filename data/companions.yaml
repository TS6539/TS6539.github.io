      head: 虽然变革型领导在相关研究中占据主导地位，但该综述得出的结论是：没有一种领导风格能适用于所有虚拟团队。
      sub: 2013年至2023年间，从17个数据库中筛选出39项经同行评审的研究，筛选过程遵循PRISMA指南；“信任”是被引用次数最多的中介变量，在7项研究中被提及。
    figures:
    - caption: 图1 · 文献检索与筛选流程的PRISMA流程图
      look: 沿着筛选流程往下看：共检索到226条记录，筛选出150条，最终纳入39项研究。
    - caption: 表2 · 已审查研究中提到的领导风格
      look: 变革型领导以23次提及位居榜首，远远领先于仅被提及15次的交易型领导。
    - caption: 表3 · 领导风格与团队效能之间的中介因素
      look: “信任”以7次的出现频率位居榜首；其下方则是一长串仅被提及一次的因素。
  ja:
    tags_label: 39件の研究における言及回数別のリーダーシップ・スタイル（表2）
    tags:
