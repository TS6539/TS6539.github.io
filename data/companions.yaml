last-to-get-a-bit-ets-2026:
  page1: page1.jpg
  tags_label: Themes in the coding tree (Figure 1)
  tags:
  - name: Perception
    count: '9'
    tint: '#dbe4ee'
  - name: Usage experience
    count: '6'
    tint: '#e3e8d8'
  - name: Challenges
    count: '6'
    tint: '#f0e2d0'
  - name: Suggestions
    count: '3'
    tint: '#ecd9d2'
  scraps:
  - - Awareness deficit
    - Skepticism
    - Perceived usefulness
    - Perception change
    - t: 7 negative to 8 positive
      stat: true
  - - Academic support
    - Career development
    - Behavior change
    - Limited understanding
    - t: 7 of 10 had never used GenAI
      stat: true
  - - Digital literacy barrier
    - Cost concerns
    - Ethical concerns
    - Mindset
    - t: 8 of 10 ended as frequent users
      stat: true
  hero:
    head: What held them back was not willingness. It was access.
    sub: Digital skills, resources, and nobody to teach them.
  figures:
  - img: fig1.jpg
    caption: Figure 1 · Codes and themes
    look: Four themes across three interview rounds. Perception alone carries nine codes.
  - img: fig2.jpg
    caption: Figure 2 · Behavior changes
    look: 'Look at “Never Used”: 7 at the start, 0 by the end.'
  - img: fig3.jpg
    caption: Figure 3 · Attitude changes
    look: Attitudes flip from 7 negative to 8 positive over one semester.
  zh:
    tags_label: 编码树中的主题（图1）
    tags:
    - 感知
    - 使用体验
    - 挑战
    - 建议
    scraps:
    - - 意识缺失
      - 怀疑主义
      - 感知效用
      - 观念的转变
      - t: 7负到8正
        stat: true
    - - 学业支持
      - 职业发展
      - 行为改变
      - 理解有限
      - t: 10人中有7人从未使用过生成式人工智能
        stat: true
    - - 数字素养障碍
      - 成本问题
      - 伦理问题
      - 思维方式
      - t: 10人中有8人最终成为频繁使用者
        stat: true
    hero:
      head: 阻碍他们的并不是意愿，而是获取渠道。
      sub: 数字技能和资源都有，却没人来教。
    figures:
    - caption: 图1 · 代码与主题
      look: 三轮访谈共涉及四个主题。仅“感知”这一项就包含九个编码。
    - caption: 图2 · 行为变化
      look: 看看“从未使用过”这一项：一开始是7，到最后变成了0。
    - caption: 图3 · 态度变化
      look: 在一个学期内，态度从7个负面转变为8个正面。
  ja:
    tags_label: コーディングツリーにおけるテーマ（図1）
    tags:
    - 知覚
    - 利用体験
    - 課題
    - ご提案
    scraps:
    - - 認識の欠如
      - 懐疑主義
      - 有用性の認識
      - 認識の変化
      - t: マイナス7からプラス8
        stat: true
    - - 学業支援
      - キャリア開発
      - 行動の変化
      - 理解が不十分
      - t: 10人のうち7人は、GenAIを使ったことがなかった
        stat: true
    - - デジタルリテラシーにおける障壁
      - コストに関する懸念
      - 倫理上の懸念
      - マインドセット
      - t: 10人のうち8人が頻繁に使うようになった
        stat: true
    hero:
      head: 彼らを阻んでいたのは、意欲の欠如ではなく、機会の欠如だった。
      sub: デジタルスキルやリソースはあるのに、それを教えてくれる人がいない。
    figures:
    - caption: 図1・コードとテーマ
      look: 3回のインタビューラウンドにわたる4つのテーマ。認識だけで9つのコードが抽出された。
    - caption: 図2・行動の変化
      look: 「未使用」の項目を見てください。最初は7つありましたが、最後には0つになりました。
    - caption: 図3・意識の変化
      look: 1学期の間で、否定的な態度が7から肯定的な態度が8へと逆転した。
icqe-2026-genai-writing:
  page1: page1.jpg
  tags_label: 'What students did with GenAI: 11 activities in 3 families'
  tags:
  - name: Functional GenAI use
    count: '5'
    tint: '#dbe4ee'
  - name: Engagement with output
    count: '2'
    tint: '#e3e8d8'
  - name: Relation to writing
    count: '4'
    tint: '#f0e2d0'
  scraps:
  - - Idea & reasoning support
    - Language support
    - Content generation
    - Source interpretation
    - Evaluation & feedback
  - - Transforming AI output
    - Taking it as-is
    - t: 0 checked AI output against the sources
      stat: true
  - - Revision & polishing
    - Moves into writing
    - Replaces writing
    - Source integration
    - t: 'Group difference: d = 2.53'
      stat: true
  hero:
    head: Nobody checked.
    sub: In 20,827 coded moments from 16 students, not one checked AI output against the source text.
  figures:
  - img: fig1.jpg
    caption: Figure 1 · Aggregate network
    look: 'The whole class in one map. The thickest tie: polishing linked to taking AI text as-is (0.25).'
  - img: fig2a.jpg
    caption: Figure 2a · Higher-quality writers
    look: Thinking support sits at the centre of this map.
  - img: fig2b.jpg
    caption: Figure 2b · Lower-quality writers
    look: The map narrows into a polishing loop.
  - img: fig2sub.jpg
    caption: Figure 2 · Difference (higher − lower)
    look: 'Blue: idea support tied to uptake (+0.22). Red: language support tied to polishing (−0.17).'
  zh:
    tags_label: 学生如何运用生成式人工智能：3大类共11项活动
    tags:
    - 通用人工智能（GenAI）的实际应用
    - 对产出的参与
    - 与写作的关系
    scraps:
    - - 思路与推理支持
      - 语言支持
      - 内容生成
      - 源文本解读
      - 评估与反馈
    - - 转换 AI 生成的内容
      - 照原样接受
      - t: 0 次核对了 AI 生成的内容与原始来源是否一致
        stat: true
    - - 修订与润色
      - 转向写作
      - 取代书写
      - 源集成
      - t: 组间差异：d = 2.53
        stat: true
    hero:
      head: 没人检查。
      sub: 在来自16名学生的20,827个标记时刻中，没有一个人将AI生成的内容与源文本进行核对。
    figures:
    - caption: 图1 · 聚合网络
      look: 整个班级都在一张图上。关联度最高的是：润色与直接采用AI生成的文本（0.25）。
    - caption: 图2a · 写作水平更高的作者
      look: “思维支持”位于这张地图的中心位置。
    - caption: 图2b · 写作水平较低的作者
      look: 地图逐渐收窄，形成一个抛光环。
    - caption: 图2 · 差值（较高值 − 较低值）
      look: 蓝色：创意支持与采用率相关（+0.22）。红色：语言支持与完善程度相关（−0.17）。
  ja:
    tags_label: 学生たちがGenAIを使って行ったこと：3つのカテゴリーに分類された11の活動
    tags:
    - GenAIの実用的な活用
    - 成果物への関与
    - 文章との関連性
    scraps:
    - - アイデアと論拠のサポート
      - 言語対応
      - コンテンツ生成
      - 出典の解釈
      - 評価とフィードバック
    - - AIの出力を変換する
      - そのまま受け入れる
      - t: 0件のAI出力をソースと照合した
        stat: true
    - - 推敲・推敲
      - 執筆へと移行する
      - 書き込みに代わる
      - ソースの統合
      - t: 群間の差：d = 2.53
        stat: true
    hero:
      head: 誰も確認しなかった。
      sub: 16人の学生から得られた20,827件の記録された場面において、AIの出力を原文と照らし合わせた学生は一人もいなかった。
    figures:
    - caption: 図1・集約ネットワーク
      look: クラス全体を1枚の地図に。最も太い結びつきは、推敲とAIの文章をそのまま取り込むことの間にある（0.25）。
    - caption: 図2a・より質の高いライター
      look: このマップの中心には、「思考のサポート」が位置しています。
    - caption: 図2b・執筆能力の低いライター
      look: マップは、研磨ループへと狭まっていく。
    - caption: 図2・差（高い値 − 低い値）
      look: 青：採用率と関連するアイデアのサポート（+0.22）。赤：完成度と関連する言語面のサポート（−0.17）。
aera-2025-last-to-get-a-bit:
  page1: page1.jpg
  tags_label: 'The codebook: 10 codes from the interviews (Appendix B)'
  tags:
  - name: Understanding
    count: '2'
    tint: '#dbe4ee'
  - name: Perceptions
    count: '2'
    tint: '#e3e8d8'
  - name: Usage
    count: '2'
    tint: '#f0e2d0'
  - name: Challenges & support
    count: '4'
    tint: '#ecd9d2'
  scraps:
  - - Limited / no understanding
    - Require support
    - Perceived negative
    - t: 'ENA shift: d = 2.91'
      stat: true
  - - Perceived benefit
    - Academic usage
    - More understanding
    - t: 5 of 10 had never heard of GenAI
      stat: true
  - - Professional usage
    - Ethical concerns
    - No challenges
  hero:
    head: They began the semester never having heard of GenAI, and ended it wanting to keep it.
    sub: Ten Mississippi Delta undergraduates, interviewed before and after a semester with GenAI; the ENA shift was d = 2.91.
  figures:
  - img: fig1.jpg
    caption: Figure 1 · ENA graphs, pre and post
    look: 'Red gives way to blue: the post-study network hangs on Perceived Benefit and Academic Usage.'
  - img: fig2.jpg
    caption: Appendix C · Subtracted ENA graph
    look: The thick blue edges run from More Understanding to Perceived Benefit and on to Academic Usage.
  zh:
    tags_label: 编码表：访谈中的10个编码（附录B）
    tags:
    - 理解
    - 认知
    - 用法
    - 挑战与支持
    scraps:
    - - 理解有限/不理解
      - 需要支持
      - 被认为具有负面影响
      - t: ENA位移：d = 2.91
        stat: true
    - - 感知到的益处
      - 学术用法
      - 更深入的理解
      - t: 10人中有5人从未听说过GenAI
        stat: true
    - - 专业用途
      - 伦理问题
      - 没有挑战
    hero:
      head: 他们开学时对生成式人工智能（GenAI）一无所知，而学期结束时却希望继续使用它。
      sub: 对十名密西西比三角洲地区的本科生进行了访谈，访谈时间分别在他们使用生成式人工智能（GenAI）一个学期之前和之后；其ENA变化量为 d = 2.91。
    figures:
    - caption: 图1 · ENA图表（治疗前与治疗后）
      look: 红色让位于蓝色：毕业后的社交网络依赖于“感知效益”和“学术用途”。
    - caption: 附录 C · 减法 ENA 图
      look: 这些粗粗的蓝色边框从“更深入的理解”延伸至“感知到的益处”，再延伸至“学术用途”。
  ja:
    tags_label: コードブック：インタビューから抽出した10のコード（付録B）
    tags:
    - 理解
    - 認識
    - 使用方法
    - 課題と支援
    scraps:
    - - 理解が限られている／理解できない
      - サポートが必要
      - 否定的に受け止められる
      - t: ENAシフト：d = 2.91
        stat: true
    - - 認識されるメリット
      - 学術的な用法
      - さらなる理解
      - t: 10人のうち5人は、GenAIという言葉を聞いたことがなかった
        stat: true
    - - 業務用途
      - 倫理上の懸念
      - 課題なし
    hero:
      head: 彼らは、この学期が始まるまではGenAIという言葉を聞いたこともなかったが、学期が終わる頃には、それを手放したくないと思うようになっていた。
      sub: ミシシッピ・デルタ地域の大学生10名を対象に、GenAIを用いた1学期の前後でインタビューを実施した。ENAのシフトは d = 2.91 であった。
    figures:
    - caption: 図1・ENAグラフ（実施前と実施後）
      look: 赤から青へ：研究後のネットワークは、「知覚された便益」と「学術的な利用」に支えられている。
    - caption: 付録 C · 差分 ENA グラフ
      look: 太い青い線は、「理解の深化」から「認識されるメリット」を経て、「学術的な使用」へと続いています。
building-pathways-female-leaders-2024:
  page1: page1.jpg
  tags_label: 'Women''s economic empowerment: change at 3 levels (Pereznieto & Taylor, 2014)'
  tags:
  - name: The individual
    count: '3'
    tint: '#dbe4ee'
  - name: The community
    count: '2'
    tint: '#e3e8d8'
  - name: Institutions and laws
    count: '3'
    tint: '#f0e2d0'
  scraps:
  - - Unpaid labor
    - Gender harassment
    - Glass ceiling
    - Lack of legal protection
  - - Mentorship
    - Patrons, not only mentors
    - Networking
    - Retention in academic medicine
  - - t: Women hold about 5% of CEO positions
      stat: true
    - t: 'Guinea: 25.6 vs 7.2 weekly hours of domestic labor, women vs men'
      stat: true
  hero:
    head: 'Two barriers recur in country after country, and one way through: mentors.'
    sub: A literature analysis of female leaders' economic empowerment. Unpaid labor and workplace harassment block the path in Western and non-Western societies alike.
  figures: []
  zh:
    tags_label: 妇女的经济赋权：三个层面的变革（Pereznieto & Taylor，2014）
    tags:
    - 个人
    - 社区
    - 制度与法律
    scraps:
    - - 无偿劳动
      - 性骚扰
      - 玻璃天花板
      - 缺乏法律保护
    - - 导师制
      - 赞助人，而不仅仅是导师
      - 人际网络
      - 医学教育领域的留任率
    - - t: 女性担任首席执行官的比例约为5%
        stat: true
      - t: 几内亚：女性与男性每周家务劳动时间分别为25.6小时和7.2小时
        stat: true
    hero:
      head: 在许多国家，有两个障碍反复出现，而突破的途径只有一个：导师。
      sub: 关于女性领导者经济赋权的文献综述。无论在西方还是非西方社会，无偿劳动和职场骚扰都阻碍了女性的进步。
    figures: []
  ja:
    tags_label: 女性の経済的エンパワーメント：3つのレベルにおける変化（Pereznieto & Taylor, 2014）
    tags:
    - その人物
    - コミュニティ
    - 制度と法律
    scraps:
    - - 無償労働
      - セクシャルハラスメント
      - ガラスの天井
      - 法的保護の欠如
    - - メンターシップ
      - メンターだけでなく、支援者たち
      - ネットワーキング
      - 医学教育分野における人材定着
    - - t: CEOのポストのうち、女性が占める割合は約5％である
        stat: true
      - t: ギニア：家事労働の週当たりの労働時間、女性25.6時間、男性7.2時間
        stat: true
    hero:
      head: 国を問わず、2つの障壁が繰り返し現れますが、それを乗り越える方法はただ一つ、メンターの存在です。
      sub: 女性リーダーの経済的エンパワーメントに関する文献分析。無償労働や職場でのハラスメントは、西洋社会でも非西洋社会でも同様に、その道のりを阻んでいる。
    figures: []
