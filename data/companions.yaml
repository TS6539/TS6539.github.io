      - 状況に応じた対応力
    hero:
      head: 研究分野では変革型リーダーシップが主流となっているが、本総説の結論としては、あらゆるバーチャルチームに通用する単一のリーダーシップスタイルは存在しないということである。
      sub: 2013年から2023年にかけての17のデータベースからPRISMA基準に基づいて選定された39件の査読済み研究。信頼が最も多く言及された媒介変数であり、7件の研究で挙げられていた。
