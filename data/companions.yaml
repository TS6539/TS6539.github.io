    caption: Table 1 · Themes and descriptions of the findings (first part)
    look: 'The first row is the one the chiefs returned to most often: the soft skills women contribute in leadership roles.'
  - img: fig2.jpg
    caption: Table 1 · Themes and descriptions of the findings (continued)
    look: 'The last row gathers the disadvantages: childcare support, a hyper-masculine culture, and too few mentors and role models.'
