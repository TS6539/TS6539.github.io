  scraps:
  - - Organizing
    - Collaborating
    - Conflict resolution
    - Persuasion
  - - Decision-making
    - Motivating others
    - Negotiation
  - - Deeper bonds with online friends than real-life ones
    - t: 53.3% of female players · 39.4% of male players
      stat: true
  hero:
    head: Massive online games give players real leadership work to do, and the skills they practice there carry into real life.
    sub: A scoping review of the video game and leadership literature; the evidence clusters in MMORPGs and MMOGs, and leadership meets games far less often than education does.
  figures: []
  zh:
    tags_label: 该评估发现游戏可带来的益处，以及各益处所引用的来源（研究结果）
    tags:
    - 动机
    - 学业表现
    - 手眼协调能力
    - 技能转移
    - 概率学习
    scraps:
    - - 组织
      - 合作
      - 冲突解决
      - 《劝导》
    - - 决策
      - 激励他人
      - 谈判
    - - 与网友的感情比与现实生活中的朋友更深厚
      - t: 53.3%的女性玩家 · 39.4%的男性玩家
        stat: true
    hero:
      head: 大型网络游戏让玩家有机会体验真实的领导工作，而他们在游戏中锻炼的技能也能应用到现实生活中。
      sub: 对电子游戏与领导力文献的一项范围综述；相关证据主要集中在MMORPG和MMOG领域，且领导力与游戏的结合远不如其与教育的结合常见。
    figures: []
  ja:
    tags_label: 本調査で明らかになった、ゲームがもたらし得るメリットと、その根拠となる出典（調査結果）
    tags:
    - 動機
    - 学業成績
    - 手と目の協調性
    - スキルの転用
    - 確率的学習
    scraps:
    - - 整理
      - 協力
      - 紛争解決
      - 説得
    - - 意思決定
      - 他者をやる気にさせる
      - 交渉
    - - オンライン上の友人との絆は、現実の友人とのそれよりも深い
      - t: 女性プレイヤーの53.3％・男性プレイヤーの39.4％
        stat: true
    hero:
      head: 大規模なオンラインゲームでは、プレイヤーは実際のリーダーシップを発揮する機会が与えられ、そこで磨いたスキルは実生活にも活かされる。
      sub: ビデオゲームとリーダーシップに関する文献のスコーピングレビュー。エビデンスはMMORPGやMMOGに集中しており、リーダーシップとゲームの関連性は、教育との関連性に比べてはるかに少ない。
    figures: []
women-police-chiefs-self-perception-2024:
  page1: page1.jpg
  tags_label: What the chiefs named, counted from the findings table (Table 1)
  tags:
  - name: Positive traits
    count: '6'
    tint: '#dbe4ee'
  - name: Special soft skills
    count: '5'
    tint: '#e3e8d8'
  - name: Leadership titles held
    count: '5'
    tint: '#f0e2d0'
  - name: Relational benefits
    count: '4'
    tint: '#ecd9d2'
  scraps:
  - - Empathy
    - Active listening
    - Conflict resolution
    - De-escalation
  - - Glass ceiling
    - The "Old Guard"
    - Few mentors or role models
    - Restricted daycare access
  - - t: 6 women chiefs and sheriffs interviewed
      stat: true
    - t: Women were 13.3% of full-time U.S. law enforcement officers in 2021
      stat: true
  hero:
    head: Women chiefs are prized for empathy and de-escalation, while the barriers in their path are structural, not personal.
    sub: Six women police chiefs and sheriffs interviewed about leading in a male-dominated profession; the disadvantages they named, from childcare to the glass ceiling, are structural and, the authors argue, changeable.
  figures:
  - img: fig1.jpg
    caption: Table 1 · Themes and descriptions of the findings (first part)
    look: 'The first row is the one the chiefs returned to most often: the soft skills women contribute in leadership roles.'
  - img: fig2.jpg
    caption: Table 1 · Themes and descriptions of the findings (continued)
    look: 'The last row gathers the disadvantages: childcare support, a hyper-masculine culture, and too few mentors and role models.'
  zh:
    tags_label: 酋长们所命名的名称，按调查结果表（表1）中的顺序排列
    tags:
    - 积极的品质
    - 特殊软技能
    - 曾担任的领导职务
    - 关系带来的好处
    scraps:
    - - 共情
      - 积极倾听
      - 冲突解决
      - 缓和局势
    - - 玻璃天花板
      - “老一辈”
      - 导师或榜样寥寥无几
      - 托儿服务受限
    - - t: 采访了6位女性警察局长和治安官
        stat: true
      - t: 2021年，女性占美国全职执法人员的13.3%
        stat: true
    hero:
      head: 女性领导者因具备同理心和缓和冲突的能力而备受推崇，而她们面临的障碍是结构性的，而非个人层面的。
      sub: 六位女性警察局长和治安官接受了采访，谈及在男性主导的职业中担任领导者的经历；她们提到的种种不利因素——从育儿问题到“玻璃天花板”——都是结构性的，而作者认为，这些情况是可以改变的。
    figures:
    - caption: 表1 · 研究结果的主题及描述（第一部分）
      look: 第一行是警察局长们最常提到的：女性在领导岗位上带来的软技能。
    - caption: 表1 · 研究结果的主题及描述（续）
      look: 最后一行总结了这些弊端：育儿支持不足、过度强调男性气概的文化，以及导师和榜样太少。
  ja:
    tags_label: 調査結果表（表1）に基づいて、首長たちが名付けたもの
    tags:
    - 長所
    - 特別なソフトスキル
    - 歴任した管理職の役職
    - 関係性によるメリット
    scraps:
    - - 共感
      - 能動的傾聴
      - 紛争解決
      - 緊張緩和
    - - ガラスの天井
      - 「オールド・ガード」
      - メンターや手本となる人物がほとんどいない
      - 保育所への利用制限
    - - t: 6人の女性警察局長および保安官へのインタビュー
        stat: true
      - t: 2021年、米国の常勤法執行官のうち、女性が占める割合は13.3％だった
        stat: true
    hero:
      head: 女性リーダーは、共感力や緊張緩和能力が高く評価されている一方で、彼女たちの前に立ちはだかる障壁は、個人的なものではなく、構造的なものである。
      sub: 男性優位の職業におけるリーダーシップについて、6人の女性警察局長および保安官にインタビューを行った。彼女たちが挙げた、育児から「ガラスの天井」に至るまでの不利益は構造的なものであり、著者らは、これらは変えられるものであると主張している。
    figures:
    - caption: 表1・調査結果のテーマと説明（前半）
      look: 首長たちが最も頻繁に挙げたのは、最初の項目、すなわち女性がリーダーシップの役割において発揮するソフトスキルでした。
    - caption: 表1・調査結果のテーマと説明（続き）
      look: 最後の行には、育児支援の不足、過度に男性優位な文化、そしてメンターやロールモデルが少なすぎるといったデメリットがまとめられている。
