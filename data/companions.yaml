      stat: true
    - t: 78 full texts excluded for missing the gamification-and-leadership focus
      stat: true
  hero:
    head: Gamification lifts leadership training, but the field still cannot agree on what gamification is.
    sub: 23 articles screened from 1,851 records; most are theoretical, and 12 never give the key term an operational definition.
  figures:
  - img: fig1.jpg
    caption: Figure 1 · PRISMA chart
    look: 'Follow the funnel down: 1,851 records become 23 studies. The biggest full-text cut is focus, 78 papers were not about gamification and leadership together.'
  - img: fig2.jpg
    caption: Figure 2 · Research methods
    look: 'One bar towers over the rest: 14 of the 23 studies are theoretical. Only 9 use any empirical design.'
  - img: fig3.jpg
    caption: Figure 3 · Data collection year
    look: Two peaks of six articles, 2019 and 2022, and none at all in 2016 or 2018. A young, spiky literature.
  zh:
    tags_label: PRISMA漏斗模型：从检索到综合（图1）
    tags:
    - 已识别的记录
    - 已筛选的摘要
    - 已评估的全文
    - 纳入的研究
    scraps:
    - - 积分、徽章、排行榜
      - 密室逃脱
      - 商业模拟
      - 严肃游戏
    - - 游戏化讲座
      - 研讨会
      - 游戏化学习
      - 角色扮演游戏
    - - t: 23个案例中有12个从未对“游戏化”进行定义
        stat: true
      - t: 因未聚焦于“游戏化与领导力”主题，剔除了78篇全文
        stat: true
    hero:
      head: 游戏化提升了领导力培训的效果，但该领域至今仍未能就“游戏化”的定义达成共识。
      sub: 从1,851条文献记录中筛选出23篇论文；其中大部分属于理论性研究，且有12篇从未对该关键词给出操作性定义。
    figures:
    - caption: 图1 · PRISMA图表
      look: 沿着筛选流程往下看：1,851条记录最终筛选出23项研究。全文筛选中最大的筛选依据是研究重点，其中78篇论文并非同时涉及游戏化与领导力这两个主题。
    - caption: 图2 · 研究方法
      look: 其中一项数据尤为突出：23项研究中有14项是理论研究。只有9项采用了实证研究设计。
    - caption: 图3 · 数据采集年份
      look: 2019年和2022年各有6篇论文，形成两个高峰，而2016年和2018年则一篇也没有。这是一门年轻且发展起伏不定的学科。
  ja:
    tags_label: PRISMAファネル：検索から統合まで（図1）
    tags:
    - 特定された記録
    - 査読済みの抄録
    - 評価対象となった全文
    - 対象となった研究
    scraps:
    - - ポイント、バッジ、ランキング
      - 脱出ゲーム
      - ビジネスシミュレーション
      - シリアスゲーム
    - - ゲーム要素を取り入れた講義
      - ワークショップ
      - ゲームを活用した学習
      - ロールプレイングゲーム
    - - t: 23件のうち12件は、ゲーミフィケーションを定義していない
        stat: true
      - t: ゲーミフィケーションとリーダーシップという焦点から外れているため、78件の全文を除外した
        stat: true
    hero:
      head: ゲーミフィケーションはリーダーシップ研修の効果を高めるが、この分野では依然として「ゲーミフィケーションとは何か」という点で意見が一致していない。
      sub: 1,851件の記録から23編の論文を選定した。その多くは理論的なものであり、12編はキーワードについて操作的定義を一切示していない。
    figures:
    - caption: 図1・PRISMAチャート
      look: ファネルを下へたどると、1,851件の記録が23件の研究に絞り込まれます。全文の選別で最も大きな割合を占めたのは「焦点」であり、78編の論文はゲーミフィケーションとリーダーシップの両方を扱ったものではありませんでした。
    - caption: 図2・研究方法
      look: ある棒グラフが他を圧倒している。23件の研究のうち14件が理論的な研究であり、実証的な研究デザインを採用しているのはわずか9件に過ぎない。
    - caption: 図3・データ収集年
      look: 2019年と2022年の2回、それぞれ6編の論文が発表され、2016年と2018年には1編もなかった。若く、波乱に富んだ研究分野である。
