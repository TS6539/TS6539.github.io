<html lang="en">

<meta property="og:title" content="Cloudline">

<style>
:root{--glass:rgba(12,20,26,.62);--glass2:rgba(12,20,26,.82);--line:rgba(255,255,255,.12);--text:#eef2f4;--muted:rgba(238,242,244,.62);--gold:#e9c46a;--amber:#f2a541}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0d3346;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans","Noto Sans CJK SC","Noto Sans CJK JP","Microsoft YaHei","Yu Gothic",system-ui,sans-serif;color:var(--text);-webkit-user-select:none;user-select:none;touch-action:none;-webkit-font-smoothing:antialiased}
canvas.full{display:block;position:fixed;inset:0;width:100%;height:100%}
.hidden{display:none!important}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);border:1px solid var(--line);border-radius:12px}
.cap{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums;font-weight:600}
.en{display:block;font-size:.62em;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:2px}
.coin{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff4cc,#e8b949 45%,#a8730f 100%);box-shadow:inset 0 0 0 1px rgba(90,60,10,.6);display:inline-block;flex:none}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none}
#hud .fade{transition:opacity 1.2s ease}
#hud.quiet .fade{opacity:.18}
.readout{position:absolute;left:max(14px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));padding:10px 14px;display:grid;grid-template-columns:auto auto;gap:3px 14px;align-items:baseline}
.readout .v{font-size:16px;text-align:right}
.readout .v small{font-size:11px;color:var(--muted);font-weight:500;margin-left:3px}
.rtop{position:absolute;right:max(14px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.coinpill{display:flex;align-items:center;gap:7px;padding:7px 12px;font-size:16px}
.wxbox{padding:9px 13px;min-width:160px}
.fuelrow{display:flex;align-items:center;gap:8px;margin-top:7px}
.fuel{flex:1;height:4px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden}
.fuel i{display:block;height:100%;width:100%;background:#e9eef0;border-radius:2px}
.wxbox.low{opacity:1!important}
.wxbox.low .fuel i{background:var(--amber);animation:pulse 1.6s ease-in-out infinite}
.wxbox.low .fuelrow .cap{color:var(--amber)}
@keyframes pulse{50%{opacity:.45}}
.mailtag{display:none;margin-top:6px;font-size:10px;letter-spacing:.16em;color:var(--gold);font-weight:700}
.mailtag.on{display:block}
.tape{position:absolute;left:max(18px,env(safe-area-inset-left));top:50%;transform:translateY(-50%);height:170px;width:40px}
.tape .ln{position:absolute;left:6px;top:0;bottom:0;width:1px;background:rgba(255,255,255,.45)}
.tape .tk{position:absolute;left:3px;width:7px;height:1px;background:rgba(255,255,255,.45)}
.tape .cb{position:absolute;left:0;width:14px;height:21px;top:calc(40% - 10px);background:linear-gradient(rgba(255,255,255,0),rgba(255,255,255,.4),rgba(255,255,255,0));border-radius:2px}
.tape .cbl{position:absolute;left:18px;top:calc(40% - 6px);font-size:9px;letter-spacing:.14em;color:rgba(255,255,255,.75);white-space:nowrap;font-weight:600}
.tape .me{position:absolute;left:0;width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;border-left:9px solid #fff;margin-top:-5px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.pause{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));pointer-events:auto;width:42px;height:42px;cursor:pointer;color:var(--text);font:600 13px/1 inherit;letter-spacing:.05em;display:grid;place-items:center}
.hint{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:9px 16px;font-size:12.5px;color:var(--muted);text-align:center;transition:opacity 1s;max-width:min(560px,80vw);opacity:0}
/* cards */
#cards{position:fixed;left:max(14px,env(safe-area-inset-left));bottom:max(76px,calc(env(safe-area-inset-bottom) + 76px));display:flex;flex-direction:column;gap:8px;pointer-events:none}
.card{display:flex;gap:11px;align-items:center;padding:9px 14px 9px 9px;width:min(320px,80vw);animation:cardIn .7s cubic-bezier(.2,.8,.2,1) both}
.card img{width:58px;height:58px;border-radius:8px;flex:none;object-fit:cover}
.card .lbl{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700;display:flex;gap:8px}
.card .lbl span{margin-left:auto;color:var(--muted);letter-spacing:.05em}
.card b{display:block;font-size:15.5px;font-weight:600;margin:3px 0 0}
.card .en{font-size:9px}
.card p{margin:4px 0 0;font-size:12px;color:var(--muted);line-height:1.4;font-style:italic}
.card .meta{font-size:10px;color:var(--muted);margin-top:4px;letter-spacing:.06em}
.card.out{animation:cardOut .7s ease forwards}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes cardOut{to{opacity:0;transform:translateY(6px)}}
#region{position:fixed;left:0;right:0;top:21%;text-align:center;pointer-events:none;opacity:0;transition:opacity 1.8s ease;text-shadow:0 1px 14px rgba(0,0,0,.45)}
#region.show{opacity:1}
#region .r0{font-size:10px;letter-spacing:.4em;text-transform:uppercase;opacity:.75;font-weight:600}
#region .r1{font-size:clamp(24px,5vw,44px);font-weight:300;letter-spacing:.3em;text-transform:uppercase;margin:8px 0 2px;padding-left:.3em}
#region .r1e{font-size:11px;letter-spacing:.32em;text-transform:uppercase;opacity:.8;margin-bottom:8px;font-weight:600}
#region .r2{font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.82;display:flex;justify-content:center;align-items:center;gap:12px;margin-top:6px}
#region .r2:before,#region .r2:after{content:"";width:36px;height:1px;background:rgba(255,255,255,.55)}
#toast{position:fixed;left:50%;top:max(70px,calc(env(safe-area-inset-top) + 64px));transform:translate(-50%,-6px);padding:8px 16px;font-weight:500;font-size:13px;opacity:0;transition:opacity .35s,transform .35s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.cl{letter-spacing:.3em;text-transform:uppercase;font-size:12px;font-weight:600;color:#fff7e6}
/* screens */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.screen.dim{background:rgba(6,14,20,.25)}
.panel{background:var(--glass2);-webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2);border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.35);padding:22px;width:min(600px,100%);max-height:100%;overflow:auto;animation:pop .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#sTitle{align-items:flex-start;padding-top:max(13vh,calc(env(safe-area-inset-top) + 64px))}
.title{display:flex;flex-direction:column;align-items:center;width:min(380px,100%);text-shadow:0 2px 20px rgba(0,0,0,.35)}
.logo{font-size:clamp(34px,8vw,58px);font-weight:200;letter-spacing:.38em;padding-left:.38em;margin:0;line-height:1}
.tag{font-size:11px;letter-spacing:.3em;text-transform:uppercase;margin:14px 0 30px;font-weight:500;text-align:center;background:rgba(12,22,28,.34);padding:6px 14px 6px 17px;border-radius:999px;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);text-shadow:0 1px 4px rgba(0,0,0,.4)}
.topbar{position:fixed;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.topbar > *{pointer-events:auto}
.tstats{display:flex;gap:14px;padding:9px 13px;font-size:13px;align-items:center;flex-wrap:wrap}
.tstats span{display:flex;gap:6px;align-items:center}
.lang{display:flex;padding:3px;gap:2px}
.lang button{border:0;background:transparent;color:var(--muted);font:600 12px/1 inherit;padding:7px 9px;border-radius:8px;cursor:pointer}
.lang button.on{background:rgba(255,255,255,.14);color:var(--text)}
.btn{border:1px solid var(--line);border-radius:12px;padding:13px 18px;font:600 14px/1.1 inherit;letter-spacing:.06em;background:rgba(255,255,255,.08);color:var(--text);cursor:pointer;transition:background .15s,transform .08s;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.btn:hover{background:rgba(255,255,255,.16)}
.btn:active{transform:scale(.98)}
.btn.primary{background:#f2f0ea;color:#14212a;border-color:transparent}
.btn.primary:hover{background:#fff}
.btn.big{width:100%;font-size:15px;padding:16px;letter-spacing:.12em;text-transform:uppercase}
.btn.small{padding:8px 12px;font-size:12px;border-radius:9px}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;width:100%;margin-top:10px}
.row .btn{flex:1}
h2{font-size:20px;font-weight:600;margin:0 0 4px;letter-spacing:.01em}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px;line-height:1.5}
.head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.head h2{margin:0;flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px}
.pc{border:1px solid var(--line);border-radius:12px;padding:0;background:rgba(255,255,255,.04);cursor:pointer;text-align:left;font:inherit;color:inherit;position:relative;overflow:hidden}
.pc.sel{border-color:rgba(255,255,255,.75);box-shadow:0 0 0 1px rgba(255,255,255,.6)}
.pc canvas{width:100%;height:96px;display:block}
.pc.locked canvas{filter:saturate(.25) brightness(.7)}
.pc .meta{padding:8px 10px 10px}
.pc b{display:block;font-size:13.5px;font-weight:600}
.pc small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.pc .price{position:absolute;top:8px;right:8px;font-size:11.5px;font-weight:600;display:inline-flex;gap:5px;align-items:center;background:rgba(8,14,18,.7);border-radius:999px;padding:4px 8px}
.statbars{display:grid;grid-template-columns:72px 1fr;gap:6px 10px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:12px 0;align-items:center}
.statbars i{display:block;height:3px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
.statbars i u{display:block;height:100%;background:#e9eef0}
.liv{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.lv{border:1px solid var(--line);border-radius:10px;padding:6px 10px 6px 6px;display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.04);cursor:pointer;font:600 12.5px/1.1 inherit;color:inherit}
.lv.sel{border-color:rgba(255,255,255,.75)}
.lv .sw{width:24px;height:24px;border-radius:6px;overflow:hidden;display:grid;grid-template-columns:2fr 1fr}
.lv small{display:block;font-weight:500;color:var(--muted);font-size:11px;margin-top:3px}
.detail{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.wx{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:6px 0 14px}
.wc{border:1px solid var(--line);border-radius:12px;padding:0;background:rgba(255,255,255,.04);cursor:pointer;font:inherit;color:inherit;text-align:left;overflow:hidden}
.wc .pv{height:48px}
.wc .tx{padding:8px 10px 9px}
.wc.sel{border-color:rgba(255,255,255,.8);box-shadow:0 0 0 1px rgba(255,255,255,.6)}
.wc b{display:block;font-size:13px;font-weight:600}
.wc small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.wc:disabled{cursor:default}
.wc:disabled .pv{filter:grayscale(1) brightness(.5)}
.mail{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;border:1px dashed rgba(233,196,106,.45);background:rgba(233,196,106,.07);margin:0 0 14px}
.mail .bag{width:44px;height:44px;flex:none;border-radius:8px;background:linear-gradient(160deg,#c9b38a,#8f7a55);position:relative;box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)}
.mail .bag:after{content:"";position:absolute;left:8px;right:8px;top:10px;height:3px;background:rgba(60,40,20,.5);border-radius:2px}
.mail .stamp{font-family:"Courier New",ui-monospace,monospace;font-size:12.5px;letter-spacing:.04em;line-height:1.4}
.mail .stamp small{display:block;color:var(--muted);font-family:inherit;font-size:11px;margin-top:2px}
.mail .tg{margin-left:auto;display:flex;gap:4px;flex:none}
.mail .tg button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:7px 9px;font:600 12px/1 inherit;cursor:pointer}
.mail .tg button.on{background:rgba(233,196,106,.2);color:#fff3d6;border-color:rgba(233,196,106,.5)}
.log{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.le{border-radius:12px;overflow:hidden;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.le img{width:100%;height:92px;object-fit:cover;display:block}
.le .tx{padding:8px 10px 10px}
.le b{display:block;font-size:13.5px;font-weight:600}
.le .en{font-size:9px}
.le small{display:block;font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:4px}
.le small.note{font-style:italic}
.le.unk .ph{height:92px;background:repeating-linear-gradient(135deg,rgba(255,255,255,.03) 0 8px,rgba(255,255,255,.06) 8px 16px);display:grid;place-items:center;font-size:10px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.le.unk small{font-style:italic}
#sLog .panel.bound{border:1px solid rgba(160,120,80,.5);box-shadow:0 0 0 6px rgba(92,60,38,.55),0 30px 80px rgba(0,0,0,.35)}
.boundnote{margin:-6px 0 14px;font-size:12.5px;color:#e8d3b0;font-style:italic}
.posts{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 4px}
.post{width:84px;height:84px;border-radius:50%;border:2px solid rgba(200,90,70,.75);color:rgba(230,130,110,.95);display:grid;place-items:center;text-align:center;font-family:"Courier New",ui-monospace,monospace;font-size:9px;letter-spacing:.06em;line-height:1.3;transform:rotate(-8deg);padding:8px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 8px}
.sum div{background:rgba(255,255,255,.05);border-radius:12px;padding:11px 13px;border:1px solid var(--line)}
.sum b{display:block;font-size:18px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.sum .wide{grid-column:1/-1}
.sum .wide b{font-size:14px;font-weight:500;line-height:1.5}
.lognote{font-style:italic;color:#f1e6d2;font-size:14px;line-height:1.5;margin:4px 0 10px;padding-left:12px;border-left:2px solid rgba(233,196,106,.5)}
.score{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:4px 0 4px}
.newbest{display:inline-block;background:var(--gold);color:#1b1408;border-radius:999px;padding:3px 9px;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-left:8px;vertical-align:middle}
.unlock{background:rgba(233,196,106,.12);border:1px solid rgba(233,196,106,.35);border-radius:12px;padding:10px 12px;font-size:13px;margin:0 0 8px}
/* postcard (diorama) presentation */
#cap{position:fixed;left:0;right:0;top:calc(var(--fy) + var(--fh) + 18px);text-align:center;pointer-events:none;display:none;color:#4a4f54}
body.vpc #cap{display:block}
#cap.in{animation:capIn 1.6s ease both}
@keyframes capIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
#cap1{font-size:17px;letter-spacing:.14em;font-weight:500;color:#3b4045}
#cap1e{font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:#8b8f93;margin-top:3px;font-weight:600}
#cap2{font-size:12px;color:#7d8287;margin-top:8px;letter-spacing:.04em}
#cap3{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:10.5px;color:#a3a7aa;margin-top:6px;letter-spacing:.08em}
body.vpc{background:#f3f1ec;--glass:rgba(250,249,246,.86);--glass2:rgba(250,249,246,.96);--line:rgba(40,40,40,.12);--text:#2c3135;--muted:rgba(44,49,53,.58)}
body.vpc .screen.dim{background:rgba(243,241,236,.35)}

body.vpc .title{color:#fff}

body.vpc #sTitle{padding-top:calc(var(--fy) + 7%)}

body.vpc .rtop{right:calc(100vw - var(--fx) - var(--fw));top:calc(var(--fy) - 46px);flex-direction:row;align-items:center;gap:14px}
body.vpc .coinpill,body.vpc .wxbox{background:none;border:0;-webkit-backdrop-filter:none;backdrop-filter:none;color:#3b4045;padding:0}
body.vpc .wxbox{min-width:150px}

body.vpc .fuel{background:rgba(0,0,0,.1)}
body.vpc .fuel i{background:#3b4045}
body.vpc .mailtag{color:#a5781e}
body.vpc .tape{left:calc(var(--fx) + 18px);top:calc(var(--fy) + var(--fh) / 2)}
body.vpc .pause{right:calc(100vw - var(--fx) - var(--fw) + 14px);top:calc(var(--fy) + 14px);bottom:auto}

body.vpc .topbar .tstats,body.vpc .topbar .lang,body.vpc .topbar .vsw{background:rgba(0,0,0,.035);border-color:rgba(0,0,0,.06);-webkit-backdrop-filter:none;backdrop-filter:none}
.vsw{border:1px solid var(--line);border-radius:12px;padding:8px 11px;font:600 12px/1 inherit;color:var(--muted);cursor:pointer;background:var(--glass)}

  f.ctl = f.ctl || { ail:0, elev:0, flap:0 }; f.ctl.ail = lerp(f.ctl.ail, steer, dt * 6); f.ctl.elev = lerp(f.ctl.elev, climb, dt * 6); f.ctl.flap = lerp(f.ctl.flap, f.landing ? 1 : 0, dt * 1.5);

  f.mist = band && cov > THR ? (1 - Math.abs(f.alt - .6) / .06) * clamp((cov - THR) / .06, 0, 1) : 0;
  f.skim = !f.landing && f.alt >= .66 && f.alt < .76 && cov > THR + .04;
  if (f.skim && !f.skimTold){ f.skimTold = true; toast(T('skim')); }

  if (band){
    if (!f.inBand){ f.inBand = true; f.bandClean = true; f.bandFrom = f.alt < .6 ? -1 : 1; f.awarded = false; f.gapT = 0; }
    if (f.mist > .15) f.bandClean = false;
    if (cov < THR - .02){ f.gapT += dt; if (f.gapT > 1.2 && f.bandClean && !f.awarded) cloudline(); }

  const gust = (vn(f.t * .35, 3, 77) - .5) * (below ? 70 : 20);

    c.coins.forEach(k => {
      if (k.got) return;

    for (let i = 0; i < n; i++) f.birds.push({ x: bx + (i % 2 ? 1 : -1) * Math.ceil(i / 2) * 22, y: by + Math.ceil(i / 2) * 16, vx: (Math.random() - .5) * 30, vy: 40, p: Math.random() * 6, hit:false });
  }
  f.birds.forEach(b => {
    b.x += b.vx * dt; b.y += b.vy * dt; b.p += dt * 8;
    if (!b.hit && f.alt < .3 && Math.hypot(b.x - f.x, b.y - f.y) < 30){ b.hit = true; b.vx = (b.x < f.x ? -1 : 1) * 160; b.vy = -60; if (f.bump <= 0){ f.altT = Math.max(f.altT, .42); f.bump = 1.2; toast(T('gulls')); } }
  });
  f.birds = f.birds.filter(b => b.y < f.y + 600 && b.y > f.y - 1200);
  // moving weather
  f.rainI = lerp(f.rainI, rainAt(f.x, f.y), dt * .8);
  if (WX.storm && f.rainI > .45){ f.nextBolt -= dt; if (f.nextBolt <= 0){ f.flash = 1; f.nextBolt = 5 + Math.random() * 8; } }
  f.flash = Math.max(0, f.flash - dt * 2.2);

function startLanding(){ const f = F; if (!f || f.landing) return; f.landing = true; f.landT = 0; f.altT = 0; }

function forNear(x, y, fn){ const cx = Math.floor(x / CH), cy = Math.floor(y / CH); for (let i = -1; i <= 1; i++) for (let j = -2; j <= 1; j++) fn(chunk(cx + i, cy + j)); }

  [164000, { city:0, farm:.9, village:.15, house:.6, trees:.9 }],

const PKEYS = ['land','isl','islS','road','farm','house','village','city','trees'];

/* idle flight behind the menus: cruising above the deck */
let IDLE = null, IDLEP = null;
/* the title view: over the meadow river, with a few cumulus in sight but clear air around the plane */
function IDLEPOS(){ if (IDLEP) return IDLEP; let best = null;
  for (let y = -230000; y > -244000; y -= 150){ const x = riverX(y) + 260; if (landF(x, y) < .1 || blockAt(x, y)) continue; if (covStatic(x, y) > THR - .05) continue; let n = 0;
    for (let gx = -900; gx <= 900; gx += 225) for (let gy = -700; gy <= 500; gy += 225){ if (Math.hypot(gx, gy) < 420) continue; if (covStatic(x + gx, y + gy) > THR + .12) n++; }
    const sc = Math.abs(n - 3); if (!best || sc < best[2]) best = [x, y, sc]; }
  IDLEP = best ? [best[0], best[1]] : [riverX(-236000) + 260, -236000]; return IDLEP; }
function idleFlight(){ if (!IDLE){ const p = planeById(SAVE.sel.plane); IDLE = { p, liv: p.liv.find(l => l.id === SAVE.sel.liv) || p.liv[0], x:IDLEPOS()[0], y:IDLEPOS()[1], a:0, av:0, alt:.45, t:0, prop:0, trail:[], ribbon:[], birds:[], rain:[], snow:[], fog:[], flash:0, landing:false, tint:[0, .02, .01], cov:.6, mist:0, shake:0 }; } return IDLE; }

/* ============================ loop (fixed timestep, so slow devices do not slow the game) ============================ */
const STEP = 1 / 60;
let toldLow = false;
let FDT = 0;
function frame(now){
  const dt = Math.min(.25, (now - (last || now)) / 1000); last = now; FDT = Math.min(dt, .1);
  if (state === 'fly' && !paused){ acc += dt; let n = 0; while (acc >= STEP && n < 16){ update(STEP); acc -= STEP; n++; if (state !== 'fly') break; } if (n >= 16) acc = 0; hud(); }
  else if (state !== 'fly') idleUpdate(dt);

  state = 'sum';
  const earned = SAVE.coins - f.prevCoins;
  $('#hud').classList.add('hidden');
  $('#sumTitle').innerHTML = esc(T('pilotsLog')) + (f.dist > f.prevBest && SAVE.flights > 1 ? `<span class="newbest">${esc(T('newBest'))}</span>` : '');
  const JJ = -f.y / 4, reg = regionObj(JJ), JPf = jparams(JJ), onLand = landF(f.x, f.y) > 0;
  const nt = onLand ? (JPf.cityZone > .4 ? NOTE_CITY : NOTE_LAND) : NOTES[WX.id];
  $('#sumNote').textContent = L3(nt).replace('{d}', fmtDist(Math.max(0, JPf.u - reg.at))).replace('{place}', L3(reg.name));
  $('#sumDist').textContent = fmtDist(f.dist);
  $('#sumWx').textContent = L3(WX.name);
  const names = f.firsts.map(k => L3(SPOTS[k].name));
  if (f.delivered) names.push(T('mailDone'));
  $('#sumCharted').textContent = names.length ? names.join(' · ') : T('nothingNew');
  const fromDist = Math.floor(f.dist / 40 * WX.mult), fromPick = Math.floor(f.pickedVal * 5 * WX.mult), fromCl = Math.floor(f.cl * 10 * WX.mult);
  $('#sumScore').innerHTML = '<span class="coin"></span>' + esc(T('score', { n: earned.toLocaleString(), a: fromDist, b: fromPick, c: fromCl }));
  const unl = WEATHER.filter(w => w.need > f.prevTotal && w.need <= SAVE.total);
  const afford = PLANES.filter(p => !SAVE.owned[p.id] && p.price <= SAVE.coins && p.price > f.prevCoins);
  let u = ''; unl.forEach(w => u += `<div class="unlock">${esc(T('unlockWx', { w: L3(w.name) }))}</div>`); afford.forEach(p => u += `<div class="unlock">${esc(T('canBuy', { p: p.name }))}</div>`);
  if (!afford.length){ const own = SAVE.owned[f.p.id] || [], lv = f.p.liv.filter(l => !own.includes(l.id)).sort((a, b) => a.price - b.price)[0]; if (lv && (SAVE.flights <= 2 || SAVE.coins >= lv.price)) u += `<div class="unlock">${esc(T('livHint', { p: f.p.name, c: lv.price }))}</div>`; }
  $('#sumUnlock').innerHTML = u;
  show('sSum');
}
let hSel = SAVE.sel.plane;
function renderHangar(){
  $('#gCoins').textContent = SAVE.coins.toLocaleString();
  $('#planeGrid').innerHTML = PLANES.map(p => { const own = !!SAVE.owned[p.id]; return `<button class="pc${hSel === p.id ? ' sel' : ''}${own ? '' : ' locked'}" data-p="${p.id}"><canvas data-thumb="${p.id}" width="330" height="192"></canvas><div class="meta"><b>${p.name}</b><small>${T(own ? (SAVE.sel.plane === p.id ? 'selected' : 'owned') : 'notOwned')}</small></div>${own ? '' : `<span class="price"><span class="coin"></span>${p.price.toLocaleString()}</span>`}</button>`; }).join('');
  document.querySelectorAll('[data-thumb]').forEach(cnv => { const p = planeById(cnv.dataset.thumb); const own = SAVE.owned[p.id]; const lv = (own && SAVE.sel.plane === p.id) ? p.liv.find(l => l.id === SAVE.sel.liv) : p.liv[0]; planeThumb(cnv, p, lv); });
  const p = planeById(hSel), own = SAVE.owned[p.id];
  const bar = (lab, v, max) => `<span>${lab}</span><i><u style="width:${Math.min(100, v / max * 100)}%"></u></i>`;
  let html = `<h2>${p.name} <span class="cap" style="margin-left:6px">${p.reg}</span></h2><p class="sub" style="margin-bottom:4px">${esc(L3(p.note))}</p><div class="statbars">${bar(T('speed'), p.speed, 1.8)}${bar(T('range'), p.fuel, 300)}${bar(T('handling'), p.turn, 1.4)}</div>`;
  if (!own) html += `<button class="btn primary" data-buy="${p.id}" ${SAVE.coins < p.price ? 'disabled' : ''}>${T('buyFor', { c: p.price.toLocaleString() })}</button>${SAVE.coins < p.price ? `<p class="sub" style="margin-top:8px">${T('needMore', { c: (p.price - SAVE.coins).toLocaleString() })}</p>` : ''}`;
  else html += `<span class="cap">${T('liveries')}</span><div class="liv">${p.liv.map(l => { const has = own.includes(l.id); const sel = SAVE.sel.plane === p.id && SAVE.sel.liv === l.id; return `<button class="lv${sel ? ' sel' : ''}" data-liv="${l.id}"><span class="sw"><span style="background:${l.c[0]}"></span><span style="background:${l.c[2]}"></span></span><span>${l.name}<small>${has ? T(sel ? 'selected' : 'owned') : '<span class="coin" style="width:9px;height:9px"></span> ' + l.price}</small></span></button>`; }).join('')}</div>`;
  $('#planeDetail').innerHTML = html;
}
$('#planeGrid').addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (!b) return; hSel = b.dataset.p; if (SAVE.owned[hSel] && SAVE.sel.plane !== hSel){ SAVE.sel = { plane: hSel, liv: SAVE.owned[hSel][0] }; persist(); IDLE = null; } renderHangar(); });
$('#planeDetail').addEventListener('click', e => {
  const buy = e.target.closest('[data-buy]'), lvb = e.target.closest('[data-liv]');
  if (buy && !buy.disabled){ const p = planeById(buy.dataset.buy); if (SAVE.coins >= p.price){ SAVE.coins -= p.price; SAVE.owned[p.id] = ['a']; SAVE.sel = { plane: p.id, liv: 'a' }; persist(); IDLE = null; toast(T('added', { p: p.name })); renderHangar(); } }
  if (lvb){ const p = planeById(hSel), l = p.liv.find(x => x.id === lvb.dataset.liv), own = SAVE.owned[p.id];
    if (own.includes(l.id)){ SAVE.sel = { plane: p.id, liv: l.id }; persist(); IDLE = null; renderHangar(); }
    else if (SAVE.coins >= l.price){ SAVE.coins -= l.price; own.push(l.id); SAVE.sel = { plane: p.id, liv: l.id }; persist(); IDLE = null; toast(T('applied', { l: l.name })); renderHangar(); }
    else toast(T('moreFor', { c: l.price - SAVE.coins })); }
});
function renderLog(){
  const ids = Object.keys(SPOTS), n = ids.filter(id => SAVE.log[id]).length, all = n === ids.length;
  $('#logCount').textContent = n + ' / ' + ids.length;
  $('#logPanel').classList.toggle('bound', all);
  $('#boundNote').innerHTML = all ? `<p class="boundnote">${esc(T('bound'))}</p>` : '';
  $('#logGrid').innerHTML = ids.map(id => { const s = SPOTS[id], e = SAVE.log[id];
    if (!e) return `<div class="le unk"><div class="ph">${esc(T('uncharted'))}</div><div class="tx"><b>?</b><small>${esc(L3(s.hint))}</small></div></div>`;
    const wx = e.wx ? L3((WEATHER.find(w => w.id === e.wx) || {}).name) : '';
    return `<div class="le"><img alt="" src="${thumbFor(id)}"><div class="tx">${dual(s.name)}<small class="note">${esc(L3(s.note))}</small><small>${[e.date, wx, e.at].filter(Boolean).map(esc).join(' · ')}${e.date ? '<br>' : ' · '}${esc(T('seen', { n: e.n }))}</small></div></div>`; }).join('');
  $('#postBox').innerHTML = SAVE.posts.length ? `<div class="detail"><span class="cap">${esc(T('postmarks'))}</span><div class="posts">${SAVE.posts.slice(-12).map(p => `<div class="post">CAPE<br>HALCYON<br>${esc(p.date)}<br>✉</div>`).join('')}</div></div>` : '';
}
function applyLang(){
  document.documentElement.lang = LANG === 'zh' ? 'zh-Hans' : LANG;
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = T(el.dataset.t));
  $('#mailLine').textContent = T('mailLine');
  document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('on', b.dataset.lang === LANG));
  $('#viewSw').textContent = T(SAVE.view === 'full' ? 'viewCard' : 'viewFull'); const cp = $('#cap'); if (cp) cp.dataset.k = '';
  THUMBN = 0;
}
let THUMBN = 0;
$('#langSw').addEventListener('click', e => { const b = e.target.closest('[data-lang]'); if (!b) return; LANG = b.dataset.lang; SAVE.lang = LANG; persist(); applyLang(); });
$('#viewSw').onclick = () => { SAVE.view = SAVE.view === 'full' ? 'postcard' : 'full'; persist(); layoutFrame(); applyLang(); };
$('#bFly').onclick = goPre;
$('#bTakeoff').onclick = takeoff;
$('#bHangar').onclick = () => { hSel = SAVE.sel.plane; show('sHangar'); renderHangar(); };
$('#bLog').onclick = () => { show('sLog'); renderLog(); };
document.querySelectorAll('[data-back]').forEach(b => b.onclick = goTitle);
$('#pauseBtn').onclick = () => { if (state === 'fly') togglePause(); };
$('#bResume').onclick = () => togglePause();
$('#bLand').onclick = () => { paused = false; show(null); if (F){ F.fuel = Math.min(F.fuel, 0); startLanding(); } };
$('#bAgain').onclick = goPre;
$('#bSumHome').onclick = goTitle;

window.__x = (y, m) => m === 'road' ? roadX(y) : harbourX(y) - 300;
window.__cl = { get F(){ return F; }, get SAVE(){ return SAVE; }, takeoff, endFlight, get state(){ return state; }, keys, gl: () => !!GL, covAt, DEST, chunk };
window.__lay = true; layoutFrame();
applyLang();
goTitle();
requestAnimationFrame(frame);
})();
</script>
