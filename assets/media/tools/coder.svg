<svg xmlns="http://www.w3.org/2000/svg" width="200" height="130" viewBox="0 0 200 130" role="img" aria-label="Transcript Coder interface schematic">
  <title>Transcript Coder interface schematic</title>
  <defs>
    <clipPath id="win"><rect x="2" y="2" width="196" height="126" rx="7"/></clipPath>
  </defs>
  <rect x="2" y="2" width="196" height="126" rx="7" fill="#fcfdfe"/>
  <g clip-path="url(#win)">
    <rect x="2" y="2" width="196" height="20" fill="#3f5a7a"/>
  </g>
  <circle cx="13" cy="12" r="3" fill="#f2f5f7"/>
  <circle cx="25" cy="12" r="3" fill="#f2f5f7"/>
  <circle cx="37" cy="12" r="3" fill="#f2f5f7"/>
  <!-- Sentence lines, one highlighted as the current sentence -->
  <rect x="12" y="32" width="104" height="7" rx="3.5" fill="#9db2c8"/>
  <rect x="12" y="46" width="104" height="13" rx="4" fill="rgba(63,90,122,.16)" stroke="#3f5a7a"/>
  <rect x="12" y="66" width="96" height="7" rx="3.5" fill="#c3cfdb"/>
  <rect x="12" y="80" width="104" height="7" rx="3.5" fill="#c3cfdb"/>
  <rect x="12" y="94" width="88" height="7" rx="3.5" fill="#c3cfdb"/>
  <!-- Code chips -->
  <rect x="126" y="32" width="62" height="14" rx="7" fill="#eef2f5" stroke="#3f5a7a"/>
  <circle cx="136" cy="39" r="3.5" fill="#3f5a7a"/>
  <rect x="144" y="36" width="34" height="6" rx="3" fill="#7d94ae"/>
  <rect x="126" y="52" width="62" height="14" rx="7" fill="#eef2f5" stroke="#3f5a7a"/>
  <circle cx="136" cy="59" r="3.5" fill="#8a6d3b"/>
  <rect x="144" y="56" width="28" height="6" rx="3" fill="#7d94ae"/>
  <rect x="126" y="72" width="62" height="14" rx="7" fill="#eef2f5" stroke="#3f5a7a"/>
  <circle cx="136" cy="79" r="3.5" fill="#5b7a5e"/>
  <rect x="144" y="76" width="38" height="6" rx="3" fill="#7d94ae"/>
  <!-- Apply button -->
  <rect x="126" y="96" width="62" height="16" rx="5" fill="#3f5a7a"/>
  <rect x="140" y="101" width="34" height="6" rx="3" fill="#f2f5f7"/>
  <rect x="2" y="2" width="196" height="126" rx="7" fill="none" stroke="#3f5a7a" stroke-width="2"/>
</svg>
