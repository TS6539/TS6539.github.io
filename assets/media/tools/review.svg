<svg xmlns="http://www.w3.org/2000/svg" width="200" height="130" viewBox="0 0 200 130" role="img" aria-label="Review Kit interface schematic">
  <title>Review Kit interface schematic</title>
  <defs>
    <clipPath id="win"><rect x="2" y="2" width="196" height="126" rx="7"/></clipPath>
  </defs>
  <rect x="2" y="2" width="196" height="126" rx="7" fill="#fcfdfe"/>
  <g clip-path="url(#win)">
    <rect x="2" y="2" width="196" height="20" fill="#3f5a7a"/>
  </g>
  <circle cx="13" cy="12" r="3" fill="#f2f5f7"/>
  <circle cx="25" cy="12" r="3" fill="#f2f5f7"/>
  <circle cx="37" cy="12" r="3" fill="#f2f5f7"/>
  <!-- Record 1: included -->
  <rect x="12" y="30" width="118" height="7" rx="3.5" fill="#9db2c8"/>
  <rect x="12" y="41" width="104" height="6" rx="3" fill="#c3cfdb"/>
  <rect x="138" y="30" width="50" height="15" rx="7.5" fill="#5b7a5e"/>
  <rect x="150" y="34.5" width="26" height="6" rx="3" fill="#f2f5f7"/>
  <!-- Record 2: excluded -->
  <rect x="12" y="56" width="110" height="7" rx="3.5" fill="#9db2c8"/>
  <rect x="12" y="67" width="96" height="6" rx="3" fill="#c3cfdb"/>
