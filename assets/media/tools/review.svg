  <rect x="150" y="60.5" width="26" height="6" rx="3" fill="#f2f5f7"/>
  <!-- PRISMA funnel -->
  <path d="M30 88 L90 88 L80 100 L80 114 L40 114 L40 100 Z" fill="rgba(63,90,122,.14)" stroke="#3f5a7a" stroke-width="1.6"/>
  <!-- Count lines -->
  <rect x="112" y="88" width="76" height="7" rx="3.5" fill="#c3cfdb"/>
  <rect x="112" y="101" width="64" height="7" rx="3.5" fill="#c3cfdb"/>
  <rect x="112" y="114" width="70" height="7" rx="3.5" fill="#9db2c8"/>
  <rect x="2" y="2" width="196" height="126" rx="7" fill="none" stroke="#3f5a7a" stroke-width="2"/>
